name: Lint catalog

on:
  pull_request:
    paths:
      - "skills/**"
      - "src/**"
      - "package.json"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Lint skills catalog
        run: npm run build && node dist/index.js lint
